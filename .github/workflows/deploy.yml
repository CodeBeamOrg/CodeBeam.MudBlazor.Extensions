name: Deploy MudExtensions

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: mudextensions-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/codebeamorg/codebeam.mudblazor.extensions:dev
            ghcr.io/codebeamorg/codebeam.mudblazor.extensions:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/apps/CodeBeam.MudBlazor.Extensions

            git fetch origin dev
            git reset --hard origin/dev

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
