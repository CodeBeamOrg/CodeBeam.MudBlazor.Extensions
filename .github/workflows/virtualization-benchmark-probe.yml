name: Virtualization benchmark probe

on:
  push:
    branches:
      - upstream/benchmarks-virtualized-select-selection-state
  pull_request:
    branches:
      - dev
    paths:
      - 'benchmarks/**'
      - '.github/workflows/virtualization-benchmark-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run upstream-to-PR1 structural probe
        shell: pwsh
        run: ./benchmarks/run-virtualization-benchmarks.ps1 -ProbeOnly -BaselineRef "7b5faf7ebb7666558d13c447313e9b09c92a110d" -FixedRef "e7020d49a824a371ab3f3450255f10d9cfad8783" -ResultsDirectory "$env:GITHUB_WORKSPACE/benchmark-results"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualization-benchmark-probe
          path: benchmark-results
