comment:
  require_changes: yes
coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 10%

ignore:
  - "**/CodeBeam.MudBlazor.Extensions.Docs/**"
  - "**/CodeBeam.MudBlazor.Extensions.UnitTests.Viewer/**"
  - "**/CodeBeam.MudBlazor.Extensions.JsMinifier/**"
  - "**/*Docs*/**"
  - "**/*Viewer*/**"
  - "**/*Samples*/**"
